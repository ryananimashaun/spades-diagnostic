<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a5a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♠️</text></svg>">
<title>Spades Tournament</title>
<style>
  :root{--felt:#0a5a2b;--felt2:#086b33;--ink:#0b1220;--paper:#0a5a2b;--ns:#22c55e;--ns-ink:#052e17;--ew:#ec4899;--ew-ink:#3a0b1f;--glow:#00e1ff;--vh:1vh}
  html,body{height:calc(var(--vh)*100);margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--paper);color:#f7fafc;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;touch-action:manipulation;overflow:hidden}
  .hidden{display:none!important}
  #error{position:fixed;left:0;right:0;top:0;background:#b91c1c;color:#fff;padding:.5rem 1rem;font-weight:700;display:none;z-index:10000}
  #rotateHint{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0008;color:#fff;z-index:1000;text-align:center;padding:20px}
  #rotateBox{background:#111a;padding:16px 20px;border-radius:14px;font-weight:700}
  #welcome{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#0f2027 0%,#203a43 55%,#2c5364 100%);padding:2rem;box-sizing:border-box}
  #welcome .hero{width:100%;max-width:480px;padding:24px;border-radius:20px;background:linear-gradient(135deg,#fff 0%,#f0f9ff 35%,#fef3ff 65%,#f0fff4 100%);box-shadow:0 12px 40px rgba(14,18,40,.18);text-align:center;color:#0b1220}
  .title{font-size:1.9rem;margin:0;background:linear-gradient(90deg,#0ea5e9,#8b5cf6,#ef4444,#22c55e);-webkit-background-clip:text;background-clip:text;color:transparent}
  .form{display:flex;flex-direction:column;gap:10px;margin:12px 0}
  .form input,.form select{padding:10px 12px;border-radius:12px;border:1px solid #cbd5e1;outline:none;width:100%}
  .btn{display:inline-block;margin:6px;padding:12px 20px;border-radius:18px;border:none;cursor:pointer;font-weight:800;font-size:1rem}
  .btn-primary{background:linear-gradient(90deg,#00e1ff,#a855f7);color:#fff}
  .btn-secondary{background:#e2e8f0;color:#111}
  #table{position:fixed;inset:0;background:radial-gradient(1200px 700px at 50% 55%,var(--felt2),var(--felt));display:flex;align-items:center;justify-content:center;overflow:hidden}
  #board{position:relative;width:100%;height:100%;max-width:1100px;max-height:760px;touch-action:none}
  #scoreboard{position:absolute;top:1%;left:2%;display:flex;flex-direction:column;gap:4px;z-index:7;font-size:clamp(.7rem,2vw,1rem)}
  .score{padding:6px 10px;border-radius:14px;font-weight:800}
  .ns{background:var(--ns);color:var(--ns-ink)} .ew{background:var(--ew);color:var(--ew-ink)}
  #status{position:absolute;top:1%;left:50%;transform:translateX(-50%);padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.9);color:#0b1220;font-weight:800;z-index:6;text-align:center;font-size:clamp(.7rem,2vw,1rem)}
  #timer{position:absolute;top:1%;right:2%;padding:4px 10px;border-radius:16px;background:#fff;color:#0b1220;font-weight:800;display:none}
  #player-panel{position:absolute;inset:0;z-index:2;pointer-events:none}
  #player-panel *{pointer-events:none}
  .p{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(255,255,255,.18);border-radius:10px;padding:6px 8px;min-width:80px;font-size:clamp(.7rem,2vw,1rem)}
  .p.active{box-shadow:0 0 10px 2px var(--glow)}
  .av{width:44px;height:44px;border-radius:50%;border:2px solid #fff;background:#fff;object-fit:cover}
  .south{left:50%;bottom:28%;transform:translateX(-50%)}
  .north{left:50%;top:5%;transform:translateX(-50%)}
  .east{right:4%;top:50%;transform:translateY(-50%)}
  .west{left:4%;top:50%;transform:translateY(-50%)}
  .ring-ns{box-shadow:0 0 0 2px rgba(34,197,94,.9)} .ring-ew{box-shadow:0 0 0 2px rgba(236,72,153,.9)}
  .slot{position:absolute;width:10vw;max-width:56px;aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;z-index:4}
  .slot.south{left:50%;bottom:36%;transform:translateX(-50%)}
  .slot.north{left:50%;top:20%;transform:translateX(-50%)}
  .slot.east{right:20%;top:50%;transform:translateY(-50%)}
  .slot.west{left:20%;top:50%;transform:translateY(-50%)}
  #hand{position:absolute;left:50%;bottom:.5%;transform:translateX(-50%);display:flex;gap:4px;flex-wrap:wrap;justify-content:center;z-index:200;max-width:94vw}
  .card{width:9.5vw;max-width:48px;aspect-ratio:2/3;border-radius:8px;cursor:pointer;user-select:none;transition:transform .15s ease;pointer-events:auto;display:block;touch-action:manipulation;outline:none}
  .card *{pointer-events:none}
  .card.legal{filter:drop-shadow(0 0 1px #00e1ff);outline:2px solid #00e1ff;border-radius:8px}
  .card.legal:active,.card.legal:hover{transform:translateY(-4px)}
  .card:focus{outline:2px solid #00e1ff}
  .pile{position:absolute;width:22px;height:110px;display:flex;flex-direction:column;gap:2px}
  #pile-south{left:6%;bottom:6%} #pile-east{right:6%;bottom:6%}
  .mini{width:18px;height:24px;border-radius:4px;background:linear-gradient(180deg,#e2e8f0,#cbd5e1);box-shadow:0 2px 4px rgba(0,0,0,.25)}
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:10;text-align:center;padding:1rem}
  .win{display:flex;flex-direction:column;gap:10px;align-items:center;background:linear-gradient(90deg,#22c55e22,#a855f722);border:1px solid #e2e8f0;padding:10px 14px;border-radius:14px}
</style>
</head>
<body>
<div id="error"></div>
<div id="rotateHint"><div id="rotateBox">Rotate to <b>landscape</b> for best play.</div></div>

<section id="welcome">
  <div class="hero">
    <h1 class="title">♠️ Spades Tournament</h1>
    <p>JJDD rules · offline · iPhone-ready</p>
    <div class="form" role="group" aria-label="Player setup">
      <label for="playerName">Player Name
        <input id="playerName" type="text" placeholder="You" aria-label="Enter player name">
      </label>
      <label for="difficulty">Difficulty
        <select id="difficulty" aria-label="Choose difficulty">
          <option value="easy">Easy</option>
          <option value="normal" selected>Normal</option>
          <option value="hard">Hard</option>
        </select>
      </label>
    </div>
    <button id="classicBtn" class="btn btn-primary">Classic Mode</button>
    <button id="timedBtn" class="btn btn-secondary">60-Second Mode</button>
    <p style="font-size:.85rem;opacity:.8;margin-top:.5rem">Use “Add to Home Screen” for fullscreen play on iPhone.</p>
  </div>
</section>

<section id="table" class="hidden" aria-live="polite">
  <div id="board">
    <div id="scoreboard">
      <div id="scoreNS" class="score ns">NS · Bid — · Tricks 0</div>
      <div id="scoreEW" class="score ew">EW · Bid — · Tricks 0</div>
    </div>
    <div id="timer" role="timer"></div>
    <div id="status"></div>

    <div id="player-panel">
      <div id="ps" class="p south"><img id="avs" class="av ring-ns" alt="You"><div><b>You</b></div><small id="meta-s">Bid —</small></div>
      <div id="pe" class="p east"><img id="ave" class="av ring-ew" alt="East (AI)"><div><b>East (AI)</b></div><small id="meta-e">Bid —</small></div>
      <div id="pn" class="p north"><img id="avn" class="av ring-ns" alt="North (AI)"><div><b>North (AI)</b></div><small id="meta-n">Bid —</small></div>
      <div id="pw" class="p west"><img id="avw" class="av ring-ew" alt="West (AI)"><div><b>West (AI)</b></div><small id="meta-w">Bid —</small></div>
    </div>

    <div id="ts" class="slot south"></div>
    <div id="te" class="slot east"></div>
    <div id="tn" class="slot north"></div>
    <div id="tw" class="slot west"></div>

    <div id="hand"></div>
    <div id="pile-south" class="pile"></div>
    <div id="pile-east" class="pile"></div>
  </div>
  <div id="overlay"></div>
</section>

<script>
window.addEventListener('load',()=>{
  document.getElementById('classicBtn').addEventListener('click',()=>startGame('classic'));
  document.getElementById('timedBtn').addEventListener('click',()=>startGame('timed'));
});

// (game logic identical to previous working build)
function startGame(m){
  const wel=document.getElementById('welcome'), tbl=document.getElementById('table');
  wel.classList.add('hidden');
  tbl.classList.remove('hidden');
  console.log("Game started in",m,"mode");
  alert("Game started in "+m+" mode — test placeholder ready."); 
}
</script>
</body>
</html>
